[package]
name = "universal-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "uo_overlay"
path = "src/lib.rs"

[[bin]]
name = "universal-overlay"
path = "src/main.rs"

[[bin]]
name = "uo-probe"
path = "src/bin/probe.rs"

[dependencies]
ab_glyph = "0.2.32"
uo-common = { path = "../common" }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
